<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>Gestor de tareas</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f1ff; --ink: #1f1535; --muted: #6d6288; --line: rgba(124, 58, 237, .16);
    --card: rgba(255, 255, 255, .74); --field: rgba(255, 255, 255, .92);
    --p1: #7c3aed; --p-soft: rgba(124, 58, 237, .12);
    --btn1: #7c3aed; --btn2: #c026d3;
    --danger: #d6336c; --shadow: 0 18px 50px -18px rgba(88, 28, 135, .35);
    --blob1: #c4b5fd; --blob2: #f0abfc; --blob3: #a5b4fc;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0a1d; --ink: #f3ecff; --muted: #a99bcc; --line: rgba(167, 139, 250, .22);
      --card: rgba(30, 20, 54, .72); --field: rgba(18, 11, 38, .75);
      --p1: #b69cff; --p-soft: rgba(167, 139, 250, .16);
      --danger: #fb7185; --shadow: 0 20px 54px -20px rgba(0, 0, 0, .75);
      --blob1: #5b21b6; --blob2: #86198f; --blob3: #3730a3;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow-x: hidden;
  }

  /* ---------- fondo animado ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
  .blob.a { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; background: var(--blob1); animation: drift1 22s ease-in-out infinite alternate; }
  .blob.b { width: 38vmax; height: 38vmax; right: -10vmax; top: 18vh; background: var(--blob2); animation: drift2 26s ease-in-out infinite alternate; }
  .blob.c { width: 34vmax; height: 34vmax; left: 20vw; bottom: -16vmax; background: var(--blob3); animation: drift3 30s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-12vmax, -8vmax) scale(.9); } }
  @keyframes drift3 { to { transform: translate(10vmax, -12vmax) scale(1.1); } }

  .wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 72px; }

  /* ---------- encabezado ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; animation: fadeDown .7s var(--ease) both; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--btn1), var(--btn2)); box-shadow: 0 8px 22px -8px var(--btn1);
    animation: pop .8s var(--ease) both .1s;
  }
  .logo svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.02em; }
  .tag { font-size: .8rem; color: var(--muted); margin: 0; }
  .userbox { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--btn1), var(--btn2)); text-transform: uppercase;
  }
  .who { font-size: .85rem; line-height: 1.2; }
  .who small { display: block; color: var(--muted); }

  /* ---------- tarjetas ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px;
    margin-bottom: 18px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
  }
  .view { animation: viewIn .65s var(--ease) both; }
  .view .card:nth-child(2) { animation-delay: .08s; }
  h2 { font-size: 1.1rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: .92rem; }

  /* ---------- formularios ---------- */
  label.lbl { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  .field { position: relative; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--field); color: inherit; font: inherit;
    transition: border-color .25s, box-shadow .25s, transform .25s var(--ease);
  }
  textarea { resize: vertical; min-height: 72px; }
  input:focus, textarea:focus { outline: none; border-color: var(--p1); box-shadow: 0 0 0 4px var(--p-soft); }
  .field .peek {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 4px 10px;
    font-size: .78rem; border-radius: 8px; border: 0; background: var(--p-soft); color: var(--p1);
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 2px solid var(--p1); outline-offset: 2px; }
  .btn {
    border: 1px solid var(--line); background: var(--field); border-radius: 12px; padding: 10px 16px;
    transition: transform .25s var(--ease), box-shadow .25s, background .25s, opacity .2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary {
    border: 0; color: #fff; font-weight: 600;
    background: linear-gradient(135deg, var(--btn1), var(--btn2)); background-size: 140% 140%; background-position: 0 50%;
    box-shadow: 0 10px 24px -10px var(--btn1);
    transition: transform .25s var(--ease), box-shadow .25s, background-position .6s var(--ease), opacity .2s;
  }
  .btn.primary:hover { background-position: 100% 50%; box-shadow: 0 14px 28px -10px var(--btn2); }
  .btn.small { padding: 6px 12px; font-size: .85rem; border-radius: 10px; }
  .btn.danger { color: var(--danger); }
  .btn[disabled] { opacity: .6; pointer-events: none; }
  .btn.wide { width: 100%; padding: 13px 16px; margin-top: 18px; }
  .spin { display: none; width: 14px; height: 14px; margin-left: 8px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; vertical-align: -2px; animation: spin .7s linear infinite; }
  .btn.loading .spin { display: inline-block; }

  /* ---------- pestañas con indicador deslizante ---------- */
  .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; margin-bottom: 18px; background: var(--p-soft); border-radius: 14px; }
  .tabs .pill {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 10px;
    background: linear-gradient(135deg, var(--btn1), var(--btn2)); box-shadow: 0 6px 16px -6px var(--btn1);
    transition: transform .5s var(--ease);
  }
  .tabs[data-mode=register] .pill { transform: translateX(100%); }
  .tabs button { position: relative; z-index: 1; border: 0; background: transparent; padding: 9px 8px; border-radius: 10px; font-weight: 600; color: var(--muted); transition: color .3s; }
  .tabs button[aria-selected=true] { color: #fff; }
  .swap { animation: textIn .45s var(--ease) both; }

  .msg { margin: 12px 0 0; font-size: .9rem; min-height: 1.3em; color: var(--danger); }
  .msg.shake { animation: shake .45s; }
  .hint { color: var(--muted); font-size: .8rem; margin: 8px 0 0; min-height: 1.2em; }

  /* ---------- progreso y filtros ---------- */
  .listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .progress-label { color: var(--muted); font-size: .85rem; }
  .bar { height: 9px; border-radius: 99px; background: var(--p-soft); overflow: hidden; margin: 10px 0 16px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--btn1), var(--btn2)); transition: width .8s var(--ease); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 14px; font-size: .85rem; color: var(--muted); transition: all .3s var(--ease); }
  .chip:hover { transform: translateY(-1px); color: var(--ink); }
  .chip[aria-pressed=true] { background: linear-gradient(135deg, var(--btn1), var(--btn2)); border-color: transparent; color: #fff; box-shadow: 0 6px 16px -8px var(--btn1); }

  /* ---------- lista de tareas ---------- */
  ul { list-style: none; margin: 0; padding: 0; }
  li.task {
    display: flex; gap: 14px; align-items: flex-start; padding: 14px; margin-bottom: 10px; border-radius: 16px;
    background: var(--field); border: 1px solid var(--line);
    transition: transform .3s var(--ease), box-shadow .3s, border-color .3s;
  }
  li.task:hover { transform: translateY(-2px); border-color: var(--p1); box-shadow: 0 12px 26px -16px var(--btn1); }
  li.task.enter { animation: taskIn .6s var(--ease) both; }
  li.task.leaving { animation: taskOut .32s ease forwards; }
  li.task .body { flex: 1; min-width: 0; }
  li.task .title { font-weight: 600; overflow-wrap: anywhere; transition: color .3s; }
  li.task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--p1); }
  li.task .desc { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; white-space: pre-wrap; }
  li.task .meta { color: var(--muted); font-size: .75rem; margin-top: 4px; }
  .badge { display: inline-block; font-size: .7rem; padding: 1px 9px; border-radius: 99px; background: var(--p-soft); color: var(--p1); margin-left: 6px; vertical-align: 2px; font-weight: 600; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .edit { display: grid; gap: 8px; }

  .check { position: relative; width: 24px; height: 24px; flex: none; margin-top: 1px; }
  .check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .box { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--p1); transition: all .3s var(--ease); }
  .box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .4s var(--ease) .05s; }
  .check input:checked + .box { background: linear-gradient(135deg, var(--btn1), var(--btn2)); border-color: transparent; transform: scale(1.08); }
  .check input:checked + .box svg { stroke-dashoffset: 0; }
  .check input:focus-visible + .box { outline: 2px solid var(--p1); outline-offset: 3px; }

  .empty { text-align: center; padding: 26px 8px 10px; color: var(--muted); animation: fadeUp .6s var(--ease) both; }
  .empty svg { width: 84px; height: 84px; margin-bottom: 8px; animation: float 4s ease-in-out infinite; }

  /* ---------- avisos ---------- */
  .toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 20; width: min(92vw, 360px); }
  .toast { padding: 12px 16px; border-radius: 14px; color: #fff; background: #2b1a52; box-shadow: 0 14px 30px -12px rgba(0,0,0,.5); animation: toastIn .5s var(--ease) both; font-size: .92rem; }
  .toast.error { background: #9f1a4a; }
  .toast.out { animation: toastOut .35s ease forwards; }

  .hidden { display: none !important; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes viewIn { from { opacity: 0; transform: translateY(22px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes textIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.5) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes taskIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes taskOut { to { opacity: 0; transform: translateX(36px) scale(.95); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float { 50% { transform: translateY(-8px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media (max-width: 480px) {
    .card { padding: 18px; border-radius: 18px; }
    li.task { flex-wrap: wrap; }
    .actions { width: 100%; justify-content: flex-start; padding-left: 38px; }
    .who { display: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div>
        <h1>Gestor de tareas</h1>
        <p class="tag">Organiza tu día con calma</p>
      </div>
    </div>
    <div id="userbox" class="userbox hidden">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="who"><span id="whoami"></span><small id="role"></small></div>
      <button id="logout" class="btn small" type="button">Salir</button>
    </div>
  </header>

  <!-- Acceso -->
  <section id="auth-view" class="view">
    <div class="card">
      <div class="tabs" id="tabs" data-mode="login" role="tablist">
        <span class="pill" aria-hidden="true"></span>
        <button id="tab-login" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
        <button id="tab-register" type="button" role="tab" aria-selected="false">Crear cuenta</button>
      </div>
      <h2 id="auth-title" class="swap">Bienvenido de nuevo</h2>
      <p id="auth-sub" class="sub swap">Entra para ver y gestionar tus tareas.</p>
      <form id="auth-form" autocomplete="on">
        <label class="lbl" for="username">Usuario</label>
        <input id="username" type="text" autocomplete="username" required minlength="3" maxlength="50">
        <label class="lbl" for="password">Contraseña</label>
        <div class="field">
          <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="100">
          <button id="peek" class="peek" type="button" aria-label="Mostrar u ocultar contraseña">Mostrar</button>
        </div>
        <p class="hint" id="auth-hint"></p>
        <button id="auth-submit" type="submit" class="btn primary wide"><span id="auth-submit-text">Entrar</span><span class="spin"></span></button>
        <p id="auth-msg" class="msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <!-- Tareas -->
  <section id="tasks-view" class="view hidden">
    <form id="new-task" class="card">
      <h2>Nueva tarea</h2>
      <p class="sub">Anota lo que tienes pendiente.</p>
      <label class="lbl" for="new-title">Título</label>
      <input id="new-title" type="text" required maxlength="120" placeholder="Ej. Entregar el proyecto">
      <label class="lbl" for="new-desc">Descripción (opcional)</label>
      <textarea id="new-desc" maxlength="1000" placeholder="Detalles, enlaces, notas…"></textarea>
      <button id="add-btn" type="submit" class="btn primary" style="margin-top:16px"><span>Agregar tarea</span><span class="spin"></span></button>
    </form>

    <div class="card">
      <div class="listhead">
        <h2 id="list-title">Mis tareas</h2>
        <span id="progress-label" class="progress-label"></span>
      </div>
      <div class="bar" aria-hidden="true"><i id="progress-bar"></i></div>
      <div class="filters" role="group" aria-label="Filtrar tareas">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">Todas</button>
        <button class="chip" type="button" data-filter="pending" aria-pressed="false">Pendientes</button>
        <button class="chip" type="button" data-filter="done" aria-pressed="false">Completadas</button>
      </div>
      <ul id="list"></ul>
      <div id="empty" class="empty hidden">
        <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <rect x="16" y="14" width="64" height="72" rx="14" fill="currentColor" opacity=".12"/>
          <rect x="16" y="14" width="64" height="72" rx="14" stroke="#a855f7" stroke-width="3"/>
          <path d="M32 40h32M32 54h32M32 68h18" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div id="empty-text">Todavía no hay tareas.</div>
      </div>
    </div>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var state = { mode: "login", tasks: [], editingId: null, admin: false, filter: "all", seen: {} };

  // ---------- token (localStorage puede no estar disponible) ----------
  function getToken() { try { return localStorage.getItem("token"); } catch (e) { return null; } }
  function setToken(t) {
    try { if (t) localStorage.setItem("token", t); else localStorage.removeItem("token"); } catch (e) {}
  }
  function decode(token) {
    try {
      var p = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(decodeURIComponent(escape(atob(p))));
    } catch (e) { return null; }
  }

  // ---------- API (nginx reenvía a auth-service y task-service) ----------
  function api(path, options) {
    options = options || {};
    var headers = { "Content-Type": "application/json" };
    var token = getToken();
    if (token) headers["Authorization"] = "Bearer " + token;
    return fetch(path, { method: options.method || "GET", headers: headers, body: options.body })
      .then(function (res) {
        if (res.status === 204) return null;
        return res.text().then(function (text) {
          var data = null;
          try { data = text ? JSON.parse(text) : null; } catch (e) {}
          if (!res.ok) {
            var err = new Error((data && data.message) || "Error " + res.status);
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
  }

  // ---------- utilidades de interfaz ----------
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function button(label, cls, onClick) {
    var b = el("button", cls, label);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }
  function restart(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }

  function toast(text, kind) {
    Array.prototype.forEach.call(document.querySelectorAll(".toast"), function (old) {
      if (old.textContent === text && old.parentNode) old.parentNode.removeChild(old); // sin avisos repetidos
    });
    var t = el("div", "toast" + (kind === "error" ? " error" : ""), text);
    $("#toasts").appendChild(t);
    setTimeout(function () {
      t.classList.add("out");
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 360);
    }, 3200);
  }

  function setAuthMsg(text) {
    var m = $("#auth-msg");
    m.textContent = text || "";
    if (text) restart(m, "shake");
  }

  function loading(btn, on) {
    btn.classList.toggle("loading", on);
    btn.disabled = on;
  }

  function formatDate(iso) {
    try {
      return new Intl.DateTimeFormat("es-CO", { day: "numeric", month: "short" }).format(new Date(iso));
    } catch (e) { return ""; }
  }

  // ---------- vistas ----------
  function showAuth() {
    $("#tasks-view").classList.add("hidden");
    $("#userbox").classList.add("hidden");
    $("#auth-view").classList.remove("hidden");
    restart($("#auth-view"), "view");
  }

  function showTasks() {
    var claims = decode(getToken()) || {};
    var roles = claims.roles || [];
    state.admin = roles.indexOf("ADMIN") !== -1;
    var name = claims.sub || "";
    $("#avatar").textContent = name.charAt(0) || "?";
    $("#whoami").textContent = name;
    $("#role").textContent = state.admin ? "Administrador" : "Usuario";
    $("#list-title").textContent = state.admin ? "Todas las tareas" : "Mis tareas";
    $("#auth-view").classList.add("hidden");
    $("#tasks-view").classList.remove("hidden");
    $("#userbox").classList.remove("hidden");
    restart($("#tasks-view"), "view");
    loadTasks();
  }

  function logout(message) {
    setToken(null);
    state.tasks = [];
    state.seen = {};
    state.editingId = null;
    showAuth();
    setAuthMsg(message || "");
  }

  function setMode(mode) {
    state.mode = mode;
    var login = mode === "login";
    $("#tabs").setAttribute("data-mode", mode);
    $("#tab-login").setAttribute("aria-selected", String(login));
    $("#tab-register").setAttribute("aria-selected", String(!login));
    $("#auth-title").textContent = login ? "Bienvenido de nuevo" : "Crea tu cuenta";
    $("#auth-sub").textContent = login ? "Entra para ver y gestionar tus tareas." : "Solo toma un momento.";
    restart($("#auth-title"), "swap");
    restart($("#auth-sub"), "swap");
    $("#auth-submit-text").textContent = login ? "Entrar" : "Crear cuenta";
    $("#password").setAttribute("autocomplete", login ? "current-password" : "new-password");
    $("#auth-hint").textContent = login ? "" : "Usuario: mínimo 3 caracteres. Contraseña: mínimo 8.";
    setAuthMsg("");
  }

  // ---------- autenticación ----------
  function login(username, password) {
    return api("/api/auth/login", { method: "POST", body: JSON.stringify({ username: username, password: password }) })
      .then(function (data) { setToken(data.access_token); showTasks(); });
  }

  $("#tab-login").addEventListener("click", function () { setMode("login"); });
  $("#tab-register").addEventListener("click", function () { setMode("register"); });

  $("#peek").addEventListener("click", function () {
    var p = $("#password");
    var show = p.type === "password";
    p.type = show ? "text" : "password";
    this.textContent = show ? "Ocultar" : "Mostrar";
  });

  $("#auth-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var username = $("#username").value.trim();
    var password = $("#password").value;
    var submit = $("#auth-submit");
    setAuthMsg("");
    loading(submit, true);

    var action;
    if (state.mode === "register") {
      action = api("/api/auth/register", { method: "POST", body: JSON.stringify({ username: username, password: password }) })
        .then(function () { return login(username, password); });
    } else {
      action = login(username, password);
    }
    action.then(function () { $("#password").value = ""; })
      .catch(function (err) {
        if (err.status === 401) setAuthMsg("Usuario o contraseña incorrectos.");
        else if (err.status === 409) setAuthMsg("Ese usuario ya existe.");
        else if (err.status === 400) setAuthMsg("Revisa los datos: usuario mínimo 3 caracteres y contraseña mínimo 8.");
        else setAuthMsg("No se pudo conectar con el servidor.");
      })
      .then(function () { loading(submit, false); });
  });

  $("#logout").addEventListener("click", function () { logout(); });

  // ---------- tareas ----------
  function handleTaskError(err) {
    if (err.status === 401) return logout("Tu sesión expiró. Inicia sesión de nuevo.");
    if (err.status === 404) { toast("La tarea ya no existe.", "error"); return loadTasks(); }
    toast("No se pudo completar la acción.", "error");
  }

  function loadTasks() {
    api("/api/tasks").then(function (tasks) {
      state.tasks = tasks || [];
      render();
    }).catch(handleTaskError);
  }

  function updateTask(t, changes) {
    var body = {
      title: changes.title !== undefined ? changes.title : t.title,
      description: changes.description !== undefined ? changes.description : t.description,
      completed: changes.completed !== undefined ? changes.completed : t.completed
    };
    return api("/api/tasks/" + t.id, { method: "PUT", body: JSON.stringify(body) }).then(function (saved) {
      state.tasks = state.tasks.map(function (x) { return x.id === t.id ? saved : x; });
      return saved;
    });
  }

  $("#new-task").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("#new-title").value.trim();
    var desc = $("#new-desc").value.trim();
    var btn = $("#add-btn");
    if (!title) return;
    loading(btn, true);
    api("/api/tasks", { method: "POST", body: JSON.stringify({ title: title, description: desc || null, completed: false }) })
      .then(function (created) {
        $("#new-title").value = "";
        $("#new-desc").value = "";
        state.tasks.push(created);
        if (state.filter === "done") setFilter("all"); else render();
        toast("Tarea agregada");
      })
      .catch(handleTaskError)
      .then(function () { loading(btn, false); });
  });

  function setFilter(f) {
    state.filter = f;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) {
      c.setAttribute("aria-pressed", String(c.getAttribute("data-filter") === f));
    });
    state.seen = {}; // al cambiar de filtro, la lista entra de nuevo con animación
    render();
  }
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) {
    c.addEventListener("click", function () { setFilter(c.getAttribute("data-filter")); });
  });

  var CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function render() {
    var list = $("#list");
    list.innerHTML = "";

    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.completed; }).length;
    $("#progress-label").textContent = total ? done + " de " + total + " completadas" : "Sin tareas aún";
    $("#progress-bar").style.width = total ? Math.round(done * 100 / total) + "%" : "0%";

    var visible = state.tasks.filter(function (t) {
      return state.filter === "all" || (state.filter === "done" ? t.completed : !t.completed);
    });

    var empty = $("#empty");
    empty.classList.toggle("hidden", visible.length > 0);
    if (!visible.length) {
      $("#empty-text").textContent = !total ? "Todavía no hay tareas. ¡Agrega la primera!"
        : state.filter === "done" ? "Aún no has completado ninguna." : "No te queda nada pendiente. ¡Bien hecho!";
    }

    visible.forEach(function (t, i) {
      var li = el("li", "task" + (t.completed ? " done" : ""));
      if (!state.seen[t.id]) {
        li.classList.add("enter");
        li.style.animationDelay = Math.min(i, 8) * 55 + "ms";
      }

      if (state.editingId === t.id) {
        var form = el("div", "body edit");
        var title = el("input"); title.type = "text"; title.value = t.title; title.maxLength = 120;
        var desc = el("textarea"); desc.value = t.description || ""; desc.maxLength = 1000;
        var row = el("div", "actions"); row.style.justifyContent = "flex-start";
        row.appendChild(button("Guardar", "btn primary small", function () {
          if (!title.value.trim()) return;
          updateTask(t, { title: title.value.trim(), description: desc.value.trim() || null })
            .then(function () { state.editingId = null; render(); toast("Cambios guardados"); })
            .catch(handleTaskError);
        }));
        row.appendChild(button("Cancelar", "btn small", function () { state.editingId = null; render(); }));
        form.appendChild(title); form.appendChild(desc); form.appendChild(row);
        li.appendChild(form);
        setTimeout(function () { title.focus(); }, 30);
      } else {
        var wrap = el("label", "check");
        var check = el("input"); check.type = "checkbox"; check.checked = t.completed;
        check.setAttribute("aria-label", "Marcar como completada");
        var box = el("span", "box"); box.innerHTML = CHECK_SVG;
        check.addEventListener("change", function () {
          updateTask(t, { completed: check.checked }).then(render).catch(handleTaskError);
        });
        wrap.appendChild(check); wrap.appendChild(box);

        var body = el("div", "body");
        var head = el("div", "title", t.title);
        if (state.admin) head.appendChild(el("span", "badge", t.owner));
        body.appendChild(head);
        if (t.description) body.appendChild(el("div", "desc", t.description));
        var when = formatDate(t.createdAt);
        if (when) body.appendChild(el("div", "meta", "Creada el " + when));

        var actions = el("div", "actions");
        actions.appendChild(button("Editar", "btn small", function () { state.editingId = t.id; render(); }));
        actions.appendChild(button("Borrar", "btn small danger", function () {
          if (!confirm("¿Borrar esta tarea?")) return;
          api("/api/tasks/" + t.id, { method: "DELETE" }).then(function () {
            li.classList.remove("enter");
            li.classList.add("leaving");
            state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; });
            setTimeout(render, 330);
            toast("Tarea borrada");
          }).catch(handleTaskError);
        }));

        li.appendChild(wrap); li.appendChild(body); li.appendChild(actions);
      }
      list.appendChild(li);
      state.seen[t.id] = true;
    });
  }

  // ---------- arranque ----------
  setMode("login");
  var existing = getToken();
  var claims = existing && decode(existing);
  if (claims && claims.exp * 1000 > Date.now()) showTasks(); else { setToken(null); showAuth(); }
})();
</script>
</body>
</html>
