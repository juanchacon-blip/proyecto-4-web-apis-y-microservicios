server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador habla solo con este nginx; él reenvía a los microservicios
    # (así no hace falta configurar CORS en el backend).
    # Se quita el encabezado Origin para que Spring no trate la petición como CORS (403).
    location /api/auth/ {
        proxy_set_header Origin "";
        proxy_pass http://auth-service:8081;
    }

    location /api/tasks {
        proxy_set_header Origin "";
        proxy_pass http://task-service:8082;
    }

    location / {
        try_files $uri /index.html;
    }
}
